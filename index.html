<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책길 — 책과 도서관을 잇는 정성</title>
  <script src="./admin-config.js"></script>
  <script>
    (async function () {
      const fallback = async () => {
        const r = await fetch('./site-default.html?fallback=' + Date.now(), {cache:'no-store'});
        if (!r.ok) throw new Error('기본 페이지를 불러오지 못했습니다.');
        return await r.text();
      };
      try {
        const c = window.CHAEKGIL_CMS_CONFIG || {};
        if (!c.supabaseUrl || c.supabaseUrl.includes('PASTE_') || !c.supabaseAnonKey || c.supabaseAnonKey.includes('PASTE_')) throw new Error('CMS is not configured');
        const u = c.supabaseUrl.replace(/\/$/, '') + '/rest/v1/site_content?id=eq.1&select=html';
        const r = await fetch(u, {headers:{apikey:c.supabaseAnonKey, Authorization:'Bearer '+c.supabaseAnonKey}, cache:'no-store'});
        if (!r.ok) throw new Error('CMS content unavailable');
        const rows = await r.json();
        const html = rows && rows[0] && rows[0].html ? rows[0].html : await fallback();
        document.open(); document.write(html); document.close();
      } catch (_) {
        try { const html = await fallback(); document.open(); document.write(html); document.close(); }
        catch (e) { document.body.textContent = '책길 홈페이지를 불러오지 못했습니다. 잠시 후 다시 열어주세요.'; }
      }
    })();
  </script>
</head>
<body><p style="font:16px sans-serif;padding:2rem">책길 홈페이지를 불러오는 중…</p></body>
</html>
