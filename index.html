<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책길 — 책과 도서관을 잇는 정성</title>
  <link rel="icon" type="image/png" href="https://chaekgil.github.io/favicon.png">
  <script src="./admin-config.js"></script>
  <script>
    (async function () {
      const applyIcon = (html) => {
        const doc = new DOMParser().parseFromString(html, 'text/html');

        doc.querySelectorAll('link[rel]').forEach((link) => {
          const rel = link.getAttribute('rel').toLowerCase().split(/\s+/);
          if (rel.includes('icon') || rel.includes('apple-touch-icon')) {
            link.remove();
          }
        });

        const icon = doc.createElement('link');
        icon.rel = 'icon';
        icon.type = 'image/png';
        icon.href = 'https://chaekgil.github.io/favicon.png';
        doc.head.appendChild(icon);

        return '<!doctype html>\n' + doc.documentElement.outerHTML;
      };

      const showPage = (html) => {
        const updated = applyIcon(html);
        document.open();
        document.write(updated);
        document.close();
      };

      const fallback = async () => {
        const r = await fetch(
          './site-default.html?fallback=' + Date.now(),
          { cache: 'no-store' }
        );
        if (!r.ok) {
          throw new Error('기본 페이지를 불러오지 못했습니다.');
        }
        return await r.text();
      };

      try {
        const c = window.CHAEKGIL_CMS_CONFIG || {};
        if (
          !c.supabaseUrl ||
          c.supabaseUrl.includes('PASTE_') ||
          !c.supabaseAnonKey ||
          c.supabaseAnonKey.includes('PASTE_')
        ) {
          throw new Error('CMS is not configured');
        }

        const u = c.supabaseUrl.replace(/\/$/, '') +
          '/rest/v1/site_content?id=eq.1&select=html';

        const r = await fetch(u, {
          headers: {
            apikey: c.supabaseAnonKey,
            Authorization: 'Bearer ' + c.supabaseAnonKey
          },
          cache: 'no-store'
        });

        if (!r.ok) throw new Error('CMS content unavailable');

        const rows = await r.json();
        const html = rows && rows[0] && rows[0].html
          ? rows[0].html
          : await fallback();

        showPage(html);
      } catch (_) {
        try {
          showPage(await fallback());
        } catch (e) {
          document.body.textContent =
            '책길 홈페이지를 불러오지 못했습니다. 잠시 후 다시 열어주세요.';
        }
      }
    })();
  </script>
</head>
<body>
  <p style="font:16px sans-serif;padding:2rem">
    책길 홈페이지를 불러오는 중…
  </p>
</body>
</html>
